<html>
    <head>
        <title>Fund Transfer</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #2c3e50, #3498db);
    color: white;
    text-align: center;
}

form {
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 10px;
    width: 350px;
    margin: 100px auto;
    box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

input {
    padding: 10px;
    width: 90%;
    margin: 10px;
    border-radius: 5px;
    border: none;
}

input[type=submit] {
    background: #3498db;
    color: white;
    cursor: pointer;
}

input[type=submit]:hover {
    background: #2980b9;
}
</style>

    </head>
    <body>
        <form name="transfer" action="transfer.jsp" method="POST">
            
        Receiver Account Number:
        <input type="text" name="receiverAcc" value="" required />    <br><br>
    Amount:
    <input type="number" name="amount" required>
    <br><br>
    Password:
    <input type="password" name="pass" required>
    <br><br>
    <input type="submit" value="Transfer">
        </form>
    </body>
</html>
